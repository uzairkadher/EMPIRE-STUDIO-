<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">
<div id="loginBox" class="p-8 max-w-sm mx-auto mt-20 text-center">
<div class="w-16 h-16 bg-yellow-400 rounded-full mx-auto flex items-center justify-center text-black font-bold text-2xl">ES</div>
<h1 class="text-2xl font-bold mt-4">EMPIRE DEV</h1>
<input id="pass" type="password" placeholder="kad123" class="w-full p-3 rounded-xl text-black mt-6">
<button id="loginBtn" class="w-full bg-yellow-400 text-black font-bold py-3 rounded-full mt-3">LOGIN</button>
<p id="msg" class="text-red-400 text-xs mt-2"></p>
</div>

<div id="panel" style="display:none" class="p-4 max-w-lg mx-auto">
<h1 class="font-bold text-yellow-400">EMPIRE CONTROL ● LIVE</h1>
<div class="flex gap-2 mt-4">
<button onclick="showTab('price')" class="bg-yellow-400 text-black px-4 py-2 rounded-full text-sm font-bold">PRICE</button>
<button onclick="showTab('theme')" class="bg-zinc-800 px-4 py-2 rounded-full text-sm">THEME</button>
</div>

<div id="tab-price" class="mt-6">
<div class="bg-zinc-900 rounded-2xl p-5">
<h3 class="font-bold text-yellow-400 text-sm">Add Package</h3>
<input id="pkgName" placeholder="STARTER" class="w-full text-black p-3 mt-2 rounded-xl">
<input id="pkgPrice" placeholder="300" class="w-full text-black p-3 mt-2 rounded-xl">
<input id="pkgPkr" placeholder="85000" class="w-full text-black p-3 mt-2 rounded-xl">
<input id="pkgDays" placeholder="3-day delivery" class="w-full text-black p-3 mt-2 rounded-xl">
<input id="pkgFeat" placeholder="1 page, WhatsApp btn" class="w-full text-black p-3 mt-2 rounded-xl">
<button id="saveBtn" class="bg-yellow-400 text-black w-full py-3 rounded-full font-bold mt-3">SAVE LIVE</button>
</div>
<div id="list" class="mt-4"></div>
<a href="index.html" class="block text-center text-zinc-500 text-xs mt-6">← Back to site</a>
</div>

<div id="tab-theme" style="display:none" class="mt-6">
<div class="bg-zinc-900 rounded-2xl p-5">
<input id="heroTitle" placeholder="Hero Title" value="Websites built on a phone." class="w-full text-black p-3 mt-2 rounded-xl">
<input id="wa" placeholder="WhatsApp 92300..." class="w-full text-black p-3 mt-2 rounded-xl">
<button onclick="saveTheme()" class="bg-yellow-400 text-black w-full py-3 rounded-full font-bold mt-3">SAVE THEME</button>
</div>
</div>
</div>

<script>
document.getElementById('loginBtn').addEventListener('click', function(){
  var p = document.getElementById('pass').value;
  if(p.trim() === 'kad123'){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('panel').style.display='block';
    load();
  } else {
    document.getElementById('msg').innerText = 'Wrong password, use kad123';
  }
});

function showTab(t){
  document.getElementById('tab-price').style.display = t==='price'?'block':'none';
  document.getElementById('tab-theme').style.display = t==='theme'?'block':'none';
}

document.getElementById('saveBtn').addEventListener('click', function(){
  var packs = JSON.parse(localStorage.getItem('empire_packs')||"[]");
  packs.push({
    id: Date.now(),
    name: document.getElementById('pkgName').value,
    price: document.getElementById('pkgPrice').value,
    pkr: document.getElementById('pkgPkr').value,
    days: document.getElementById('pkgDays').value,
    features: document.getElementById('pkgFeat').value
  });
  localStorage.setItem('empire_packs', JSON.stringify(packs));
  alert('SAVED LIVE!');
  load();
  document.getElementById('pkgName').value='';
});

function load(){
  var packs = JSON.parse(localStorage.getItem('empire_packs')||"[]");
  var html='';
  packs.forEach(function(p){
    html += "<div class='bg-zinc-900 p-3 rounded-xl mt-2 flex justify-between'><span>"+p.name+" $"+p.price+" "+p.days+"</span><button onclick='del("+p.id+")' style='color:red'>X</button></div>";
  });
  document.getElementById('list').innerHTML = html;
}
function del(id){
  var packs = JSON.parse(localStorage.getItem('empire_packs')||"[]").filter(function(p){return p.id!=id});
  localStorage.setItem('empire_packs', JSON.stringify(packs));
  load();
}
function saveTheme(){
  localStorage.setItem('empire_theme', JSON.stringify({heroTitle: document.getElementById('heroTitle').value, waNumber: document.getElementById('wa').value}));
  alert('THEME SAVED');
}
</script>
</body>
</html>
