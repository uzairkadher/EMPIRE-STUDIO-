<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMPIRE STUDIO - web developer team by @4t_jagga</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>body{font-family:'Space Grotesk',sans-serif}</style>
</head>
<body class="bg-black text-white">

<header class="p-6 flex justify-between items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
<span class="font-bold text-yellow-400 tracking-widest">EMPIRE STUDIO</span>
<a href="admin.html" class="text-[10px] bg-zinc-900 px-3 py-1 rounded-full">DEV</a>
</header>

<section class="px-6 py-12 text-center">
<h1 id="heroText" class="text-4xl font-bold leading-tight">web developer team by <span class="text-yellow-400">@4t_jagga</span></h1>
<p class="text-zinc-500 text-xs mt-3 tracking-wide">31 sites in 30 days — Lahore → Worldwide</p>
<a id="waBtn" href="https://wa.me/923000000000" target="_blank" class="inline-block bg-yellow-400 text-black font-bold px-8 py-3 rounded-full mt-6 text-sm">WhatsApp Me</a>
</section>

<h2 class="px-6 font-bold text-sm uppercase tracking-widest">Packages — Live</h2>
<div id="packages" class="p-4 grid gap-4"></div>

<h2 class="px-6 font-bold text-sm uppercase tracking-widest mt-8">Portfolio</h2>
<div id="sites" class="p-4 grid grid-cols-2 gap-3 text-xs text-zinc-500">Coming soon — 31 sites</div>

<footer class="p-6 text-center text-[10px] text-zinc-600 border-t border-zinc-900 mt-10">
© 2026 Empire Studio — @4t_jagga
</footer>

<script>
// Render packages from localStorage (Chrome)
function render(){
  // theme
  let theme = JSON.parse(localStorage.getItem('empire_theme')||"{}");
  if(theme.heroTitle && theme.heroTitle.trim()!=""){
    let t = theme.heroTitle;
    // make @4t_jagga yellow if present
    if(t.includes('@4t_jagga')){
      t = t.replace('@4t_jagga','<span class="text-yellow-400">@4t_jagga</span>');
    } else if(t.includes('@')){
      // make any @ mention yellow
      t = t.replace(/(@\w+)/g,'<span class="text-yellow-400">$1</span>');
    }
    document.getElementById('heroText').innerHTML = t;
  }
  if(theme.waNumber){
    document.getElementById('waBtn').href = "https://wa.me/"+theme.waNumber.replace(/[^0-9]/g,'');
  }

  // packages
  let packs = JSON.parse(localStorage.getItem('empire_packs')||"[]");
  let box = document.getElementById('packages');
  if(packs.length===0){
    box.innerHTML = `<div class='border border-dashed border-zinc-800 p-8 rounded-2xl text-center'><p class='text-zinc-300 text-sm'>No packages yet — add in DEV panel</p><p class='text-[10px] text-zinc-600 mt-2'>Open in Chrome: /admin.html → add packages</p></div>`;
  } else {
    box.innerHTML="";
    packs.forEach(p=>{
      box.innerHTML+=`
      <div class="bg-zinc-900 border border-yellow-500/20 rounded-2xl p-5">
        <div class="flex justify-between items-center text-xs">
          <b class="text-yellow-400 tracking-widest">${p.name||'PACKAGE'}</b>
          <span class="bg-zinc-800 px-2 py-1 rounded-full text-[10px]">${p.days||''}</span>
        </div>
        <div class="text-3xl font-bold mt-3">$${p.price||'300'} <span class="text-xs text-zinc-500 font-normal">${p.pkr||''} PKR</span></div>
        <p class="text-xs text-zinc-400 mt-2">${p.features||''}</p>
        <a href="https://wa.me/923000000000?text=I want ${p.name}" class="block bg-yellow-400 text-black text-center font-bold py-3 rounded-full mt-4 text-sm">Order ${p.name||''}</a>
      </div>`;
    });
  }
}
render();
// auto-refresh every 2 sec so admin changes appear
setInterval(render, 2000);
</script>
</body>
</html>
